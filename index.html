<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Панель управления ИИ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #18222d; color: #fff; padding: 15px; margin: 0; }
        h2 { text-align: center; color: #64b5f6; margin-top: 0; }
        label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; }
        textarea, input, select { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 5px; border-radius: 8px; border: 1px solid #2b394a; background: #232e3c; color: #fff; font-size: 14px; }
        textarea { height: 100px; resize: vertical; }
        button { width: 100%; padding: 12px; margin-top: 20px; border: none; border-radius: 8px; background: #2ea6ff; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; }
        button:active { background: #1e88e5; }
    </style>
</head>
<body>
    <h2>⚡ AI Control Panel</h2>
    
    <label>Актуальные знания (Контекст в реальном времени):</label>
    <textarea id="knowledge" placeholder="Например: Сегодня новый ролик в 18:00, админ тащит в Бравл!"></textarea>

    <label>Шанс авто-ответа в чате (%):</label>
    <input type="number" id="autoChance" min="0" max="100" value="3">

    <button onclick="sendData()">Сохранить настройки</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function sendData() {
            const data = {
                knowledge: document.getElementById('knowledge').value,
                autoChance: parseInt(document.getElementById('autoChance').value) || 0
            };
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
