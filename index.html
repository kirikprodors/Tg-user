<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Admin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: sans-serif; background: #18222d; color: #fff; padding: 15px; margin: 0; }
        .card { background: #232e3c; padding: 15px; border-radius: 12px; margin-bottom: 12px; }
        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        textarea, input { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #444; background: #1c2531; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 14px; background: #2ea6ff; border: none; border-radius: 10px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px; }
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #555; transition: .3s; border-radius: 24px; }
        .slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
        input:checked + .slider { background-color: #2ea6ff; }
        input:checked + .slider:before { transform: translateX(20px); }
    </style>
</head>
<body>
    <h2>⚡ AI Control Panel</h2>
    <div class="card">
        <div class="row">
            <span>Бот включен</span>
            <label class="switch"><input type="checkbox" id="botEnabled" checked><span class="slider"></span></label>
        </div>
        <div class="row">
            <span>Отвечать в группах</span>
            <label class="switch"><input type="checkbox" id="groupEnabled" checked><span class="slider"></span></label>
        </div>
        <div style="margin-top: 10px;">
            <label>Шанс ответа в чате (%):</label>
            <input type="number" id="autoChance" value="15" min="0" max="100">
        </div>
    </div>

    <div class="card">
        <label>Живые знания (контекст):</label>
        <textarea id="knowledge" rows="3" placeholder="Что бот должен знать прямо сейчас..."></textarea>
    </div>

    <button onclick="saveSettings()">Сохранить настройки</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function saveSettings() {
            const data = {
                bot_enabled: document.getElementById('botEnabled').checked,
                group_enabled: document.getElementById('groupEnabled').checked,
                auto_chance: parseInt(document.getElementById('autoChance').value) || 0,
                knowledge: document.getElementById('knowledge').value
            };
            
            // Отправка данных бота в Telegram
            tg.sendData(JSON.stringify(data));
        }
    </script>
</body>
</html>
